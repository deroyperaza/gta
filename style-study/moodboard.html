<!doctype html>
<html><head><meta charset="utf-8"><title>Style Moodboard</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="c"></canvas>
<script>
// Style study: same Brooklyn intersection, three art directions. ?s=golden | neon | overcast
const S = new URLSearchParams(location.search).get('s') || 'golden';
const W = 1280, H = 720, CX = 640, CY = 400, K = 0.0011, SC = 1.5;
const cv = document.getElementById('c'); cv.width = W * SC; cv.height = H * SC;
const ctx = cv.getContext('2d'); ctx.scale(SC, SC);
const NIGHT = S === 'neon', OVER = S === 'overcast', GOLD = S === 'golden';

let seed = 1337;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
const pick = (a) => a[Math.floor(rnd() * a.length)];
const norm = (x, y) => { const l = Math.hypot(x, y); return [x / l, y / l]; };

function rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function col(h, a = 1, mul = 1) {
  let [r, g, b] = rgb(h); r *= mul; g *= mul; b *= mul;
  if (NIGHT) { r = r * 0.2 + 6; g = g * 0.23 + 9; b = b * 0.33 + 24; }
  else if (OVER) { const l = (r + g + b) / 3; r = (r * 0.55 + l * 0.45) * 0.9; g = (g * 0.55 + l * 0.45) * 0.93; b = (b * 0.55 + l * 0.45) * 0.97 + 5; }
  return `rgba(${Math.min(255, r) | 0},${Math.min(255, g) | 0},${Math.min(255, b) | 0},${a})`;
}
const SH = GOLD ? { x: 1.05, y: 0.4, a: 0.55, blur: 1.5 } : OVER ? { x: 0.12, y: 0.2, a: 0.3, blur: 9 } : { x: 0.04, y: 0.08, a: 0.35, blur: 7 };
const SUN = GOLD ? norm(-1, -0.4) : OVER ? norm(-0.3, -0.6) : norm(0, -1);
const P = (x, y, h) => [x + (x - CX) * h * K, y + (y - CY) * h * K];
const lights = []; const cones = [];
const glow = (x, y, r, c, a = 1) => lights.push({ x, y, r, c, a });

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, a = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, a, 0, Math.PI * 2); }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
const L2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
function hull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}

// ---------- layout ----------
const AV0 = 560, AV1 = 760, ST0 = 340, ST1 = 470, SW = 34;
const B = [];
// Park Slope-ish brownstone row (TL)
{ let x = 4; const ws = [74, 70, 76, 72, 70, 74, 86];
  ws.forEach((w, i) => { B.push({ x, y: 126, w: w - 2, h: 180, ht: R(66, 86), floors: 4, win: [2], type: 'brown',
    wall: pick(['#6b4436', '#734a3a', '#7f5440', '#5e3e33', '#8a5a45']), roof: pick(['#b7babd', '#a9adb1', '#4a4542', '#c2c4c4', '#57504b']) }); x += w; }); }
B.push({ x: 800, y: 200, w: 130, h: 106, ht: 58, floors: 3, win: [2, 3], wall: '#7d4434', roof: '#4b4643', type: 'bodega' });
B.push({ x: 800, y: 112, w: 130, h: 84, ht: 84, floors: 4, win: [3], wall: '#8b5a44', roof: '#b6b8ba' });
B.push({ x: 936, y: 112, w: 248, h: 194, ht: 150, floors: 7, win: [2, 3], wall: '#a08d78', roof: '#9fa3a6', type: 'apt' });
B.push({ x: 1190, y: 150, w: 92, h: 156, ht: 96, floors: 5, win: [2], wall: '#6f3f33', roof: '#4a4644' });
B.push({ x: 800, y: -40, w: 482, h: 144, ht: 118, floors: 6, win: [2], wall: '#8c8478', roof: '#a6a8aa' });
B.push({ x: 4, y: 508, w: 296, h: 230, ht: 66, floors: 2, win: [0, 1], wall: '#5c6167', roof: '#6d6e6c', type: 'ware', ws: 30 });
B.push({ x: 830, y: 516, w: 210, h: 240, ht: 220, floors: 20, win: [0, 3], wall: '#5d7385', roof: '#3a3f45', type: 'glass' });

const roofRect = (b) => { const a = P(b.x, b.y, b.ht), c = P(b.x + b.w, b.y + b.h, b.ht); return { x: a[0], y: a[1], w: c[0] - a[0], h: c[1] - a[1] }; };

// ---------- ground ----------
function ground() {
  ctx.fillStyle = col('#8d8981'); ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = col('#5d5a55', 0.35); ctx.lineWidth = 0.7;
  for (let x = 0; x < W; x += 22) line(x, 0, x, H);
  for (let y = 0; y < H; y += 22) line(0, y, W, y);
  for (let i = 0; i < 900; i++) { ctx.fillStyle = col(rnd() < .5 ? '#3a3835' : '#c9c4ba', R(.05, .2)); ctx.fillRect(R(0, W), R(0, H), R(1, 2.5), R(1, 2.5)); }
  // lots
  [[0, 0, 526, 306], [794, 0, 486, 306], [0, 504, 526, 216], [794, 504, 486, 216]].forEach(l => { ctx.fillStyle = col('#4b4843'); ctx.fillRect(...l); });
  // TL backyards
  let x = 4; [74, 70, 76, 72, 70, 74, 86].forEach((w) => {
    ctx.fillStyle = col(pick(['#4f6b3a', '#5a6e40', '#6b5a44', '#7d7466', '#4a5f36'])); ctx.fillRect(x, 0, w - 2, 126);
    if (rnd() < .5) { ctx.fillStyle = col('#9a8f80'); ctx.fillRect(x + 6, 96, w - 14, 26); for (let k = 0; k < 6; k++) { ctx.strokeStyle = col('#6e665c', .6); line(x + 6, 100 + k * 4, x + w - 8, 100 + k * 4); } }
    ctx.strokeStyle = col('#6b4f36'); ctx.lineWidth = 2; line(x + w - 2, 0, x + w - 2, 126);
    if (rnd() < .5) { ctx.fillStyle = col('#2c2c30'); rr(x + R(8, 30), R(20, 70), 18, 12, 2); ctx.fill(); }
    x += w;
  });
  // BL vacant lot
  ctx.fillStyle = col('#5b5146'); ctx.fillRect(310, 508, 216, 212);
  for (let i = 0; i < 1400; i++) { ctx.fillStyle = col(pick(['#6f7a3c', '#4f5a2a', '#7a6a55', '#3e372f', '#8a8070']), R(.3, .8)); ctx.fillRect(R(310, 526), R(508, 720), R(1, 3), R(1, 3)); }
  ctx.fillStyle = col('#c9c1b5'); rr(360, 600, 34, 22, 3); ctx.fill(); ctx.strokeStyle = col('#8a7f70', .7); ctx.strokeRect(362, 602, 30, 18);
  [[420, 660], [436, 668]].forEach(([a, b]) => { ctx.strokeStyle = col('#141414'); ctx.lineWidth = 5; ell(a, b, 9, 9); ctx.stroke(); });
  // BR plaza
  ctx.fillStyle = col('#a7a39b'); ctx.fillRect(1046, 504, 234, 216);
  ctx.strokeStyle = col('#86827a', .6); ctx.lineWidth = .8; for (let i = 1046; i < W; i += 14) line(i, 504, i, H); for (let j = 504; j < H; j += 28) line(1046, j, W, j);
  // curbs
  ctx.fillStyle = col('#bdb8ae'); ctx.fillRect(556, 0, 4, H); ctx.fillRect(760, 0, 4, H); ctx.fillRect(0, 336, W, 4); ctx.fillRect(0, 470, W, 4);
  // roads
  ctx.fillStyle = col('#2e3033'); ctx.fillRect(AV0, 0, AV1 - AV0, H); ctx.fillRect(0, ST0, W, ST1 - ST0);
  for (let i = 0; i < 14; i++) { ctx.fillStyle = col(pick(['#35373a', '#27292b', '#3a3c3e']), .8); const v = rnd() < .5; v ? ctx.fillRect(R(570, 740), R(0, 700), R(20, 50), R(40, 140)) : ctx.fillRect(R(0, 1200), R(345, 440), R(40, 160), R(14, 30)); }
  // bus lane
  ctx.fillStyle = col('#8e2b26', .85); ctx.fillRect(724, 0, 36, 300); ctx.fillRect(724, 508, 36, 212);
  // markings
  ctx.fillStyle = col('#d9a520', .9);
  [[656, 0, 2.5, 300], [661.5, 0, 2.5, 300], [656, 508, 2.5, 212], [661.5, 508, 2.5, 212], [0, 402, 520, 2.5], [0, 407.5, 520, 2.5], [800, 402, 480, 2.5], [800, 407.5, 480, 2.5]].forEach(r => ctx.fillRect(...r));
  ctx.fillStyle = col('#e8e6e0', .85);
  for (let y = 0; y < H; y += 44) if (y + 22 < 300 || y > 508) { ctx.fillRect(621, y, 2, 22); }
  ctx.fillRect(722, 0, 2.5, 300); ctx.fillRect(722, 508, 2.5, 212); ctx.fillRect(584, 0, 1.5, 300); ctx.fillRect(584, 508, 1.5, 212);
  for (let x = 566; x < 756; x += 16) { ctx.fillRect(x, 310, 9, 24); ctx.fillRect(x, 476, 9, 24); }
  for (let y = 346; y < 466; y += 16) { ctx.fillRect(530, y, 26, 9); ctx.fillRect(764, y, 26, 9); }
  ctx.fillRect(562, 300, 96, 4); ctx.fillRect(662, 504, 96, 4); ctx.fillRect(516, 407, 4, 61); ctx.fillRect(800, 342, 4, 61);
  ctx.save(); ctx.translate(742, 230); ctx.rotate(-Math.PI / 2); ctx.font = '800 15px "Helvetica Neue",Arial'; ctx.textAlign = 'center'; ctx.fillText('BUS ONLY', 0, 5); ctx.restore();
  ctx.save(); ctx.translate(742, 640); ctx.rotate(-Math.PI / 2); ctx.font = '800 15px "Helvetica Neue",Arial'; ctx.textAlign = 'center'; ctx.fillText('BUS ONLY', 0, 5); ctx.restore();
  // wear + grit on asphalt
  for (let i = 0; i < 16000; i++) {
    let x, y; if (rnd() < .45) { x = R(AV0, AV1); y = R(0, H); } else { x = R(0, W); y = R(ST0, ST1); }
    ctx.fillStyle = rnd() < .5 ? col('#55575a', R(.2, .6)) : col('#1d1e20', R(.2, .6)); ctx.fillRect(x, y, R(.8, 2.2), R(.8, 1.8));
  }
  ctx.strokeStyle = col('#18191b', .7); ctx.lineWidth = .8;
  for (let i = 0; i < 45; i++) { let x = rnd() < .5 ? R(AV0, AV1) : R(0, W), y = x > AV0 && x < AV1 ? R(0, H) : R(ST0, ST1); ctx.beginPath(); ctx.moveTo(x, y); for (let k = 0; k < 6; k++) { x += R(-9, 9); y += R(-9, 9); ctx.lineTo(x, y); } ctx.stroke(); }
  [[603, 200], [641, 600], [693, 120], [300, 427], [1000, 383], [180, 383]].forEach(([x, y]) => { const g = ctx.createRadialGradient(x, y, 0, x, y, 16); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ell(x, y, 10, 16, x > AV0 && x < AV1 ? 0 : Math.PI / 2); ctx.fill(); });
  [[660, 170], [700, 610], [300, 405], [1010, 420]].forEach(([x, y]) => { ctx.fillStyle = col('#3d3a36'); ell(x, y, 9, 9); ctx.fill(); ctx.strokeStyle = col('#55514b'); ctx.lineWidth = 1; for (let r = 3; r < 9; r += 2.5) { ell(x, y, r, r); ctx.stroke(); } });
}

// ---------- shadows ----------
function buildingShadows() {
  for (const b of B) {
    const base = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]];
    const off = base.map(p => [p[0] + SH.x * b.ht, p[1] + SH.y * b.ht]);
    ctx.save(); ctx.filter = `blur(${SH.blur * 2}px)`; ctx.fillStyle = `rgba(10,8,20,${SH.a})`; poly(hull(base.concat(off))); ctx.fill(); ctx.restore();
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 12; ctx.fillStyle = col('#3a3733'); ctx.fillRect(b.x, b.y, b.w, b.h); ctx.restore();
  }
}

// ---------- props ----------
function tree(x, y, r, ht = 32) {
  ctx.save(); ctx.filter = `blur(${SH.blur + 2}px)`; ctx.fillStyle = `rgba(10,8,20,${SH.a * .85})`; ell(x + SH.x * ht, y + SH.y * ht, r, r * .9); ctx.fill(); ctx.restore();
  const [px, py] = P(x, y, ht);
  const g = ctx.createRadialGradient(px - SUN[0] * -r * .3, py - SUN[1] * -r * .3, r * .2, px, py, r * 1.1);
  g.addColorStop(0, col('#5f8a3c')); g.addColorStop(.7, col('#3d6128')); g.addColorStop(1, col('#22381a'));
  ctx.fillStyle = g;
  for (let i = 0; i < 9; i++) { const a = rnd() * 6.28, d = R(0, r * .5); ell(px + Math.cos(a) * d, py + Math.sin(a) * d, r * R(.45, .65), r * R(.45, .65)); ctx.fill(); }
  for (let i = 0; i < 26; i++) { const a = rnd() * 6.28, d = R(0, r * .85); ctx.fillStyle = col(rnd() < .5 ? '#7ea54e' : '#1f3317', R(.25, .55)); ell(px + Math.cos(a) * d + SUN[0] * 2, py + Math.sin(a) * d + SUN[1] * 2, R(2, 4.5), R(2, 4.5)); ctx.fill(); }
}
function bags(x, y, n) { for (let i = 0; i < n; i++) { const bx = x + R(-9, 9), by = y + R(-4, 4); ctx.fillStyle = 'rgba(0,0,0,.4)'; ell(bx + SH.x * 4 + 1, by + SH.y * 4 + 1, 6, 5); ctx.fill(); ctx.fillStyle = col('#141416'); ell(bx, by, R(5, 7), R(4.5, 6)); ctx.fill(); ctx.fillStyle = col('#8a8e98', .5); ell(bx - 1.5, by - 1.5, 1.6, 1); ctx.fill(); } }
function lamp(x, y, dx, dy) {
  const top = P(x, y, 45); ctx.strokeStyle = col('#3b3e42'); ctx.lineWidth = 2.2; line(x, y, top[0], top[1]);
  const hx = top[0] + dx * 16, hy = top[1] + dy * 16; ctx.lineWidth = 1.6; line(top[0], top[1], hx, hy);
  ctx.fillStyle = col('#2a2c2f'); ell(hx, hy, 4.5, 3, Math.atan2(dy, dx)); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.save(); ctx.lineWidth = 2; ctx.strokeStyle = `rgba(0,0,0,${SH.a * .6})`; line(x, y, x + SH.x * 45, y + SH.y * 45); ctx.restore();
  if (NIGHT) { ctx.fillStyle = '#ffe0a8'; ell(hx, hy, 2.5, 2); ctx.fill(); glow(x + dx * 18, y + dy * 18, 120, '255,170,80', .55); glow(hx, hy, 18, '255,220,170', .9); }
}
function signal(x, y, greenAve) {
  ctx.fillStyle = col('#2a2a2a'); ell(x, y, 2.5, 2.5); ctx.fill(); const t = P(x, y, 40);
  ctx.strokeStyle = col('#2b2d30'); ctx.lineWidth = 2; line(x, y, t[0], t[1]);
  ctx.fillStyle = col('#1d1e20'); rr(t[0] - 4, t[1] - 4, 8, 8, 2); ctx.fill();
  const c = greenAve ? '#3dff9a' : '#ff3b30'; ctx.fillStyle = c; ell(t[0], t[1], 2, 2); ctx.fill();
  if (NIGHT) glow(t[0], t[1], 26, greenAve ? '61,255,154' : '255,59,48', .7);
}
function props() {
  [[50, 322], [250, 322], [460, 322], [70, 488], [250, 488], [778, 70], [778, 220], [542, 560], [542, 680]].forEach(([x, y]) => { ctx.fillStyle = col('#3e3529'); ctx.fillRect(x - 8, y - 8, 16, 16); ctx.strokeStyle = col('#77706a'); ctx.lineWidth = 1; ctx.strokeRect(x - 8, y - 8, 16, 16); });
  bags(420, 330, 6); bags(1210, 488, 5); bags(150, 488, 4); bags(546, 620, 3); bags(1040, 330, 4);
  ctx.fillStyle = col('#a8322a'); ell(520, 334, 3, 3); ctx.fill(); ctx.fillStyle = col('#d0d0c8'); ell(520, 334, 1.2, 1.2); ctx.fill();
  // community fridge + crate
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(468 + SH.x * 14, 478 + SH.y * 14, 18, 14);
  ctx.fillStyle = col('#e9e6df'); rr(466, 476, 18, 14, 2); ctx.fill();
  [['#ff4fa3', 468, 478], ['#ffcf3f', 474, 482], ['#2fd1c5', 478, 478], ['#7b3fe4', 470, 485]].forEach(([c, x, y]) => { ctx.fillStyle = col(c, .9); ctx.fillRect(x, y, 5, 3); });
  ctx.fillStyle = col('#2f6bd8'); ctx.fillRect(488, 479, 11, 9); ['#d93b2b', '#f2a023', '#5fa83a', '#d93b2b'].forEach((c, i) => { ctx.fillStyle = col(c); ell(490 + i * 2.4, 482 + (i % 2) * 3, 1.6, 1.6); ctx.fill(); });
  if (NIGHT) glow(475, 483, 30, '200,230,255', .4);
  // fence along vacant lot
  ctx.strokeStyle = col('#a7aaad', .55); ctx.lineWidth = .6; for (let x = 310; x < 526; x += 3) line(x, 506, x + 3, 509);
  ctx.strokeStyle = col('#8b8e91'); ctx.lineWidth = 1.4; line(310, 507, 526, 507); line(524, 507, 524, 720);
  for (let x = 310; x <= 526; x += 36) { ctx.fillStyle = col('#6e7175'); ell(x, 507, 1.8, 1.8); ctx.fill(); }
  // lamps & signals
  [[120, 334, 0, 1], [330, 334, 0, 1], [900, 334, 0, 1], [1230, 334, 0, 1], [120, 476, 0, -1], [330, 476, 0, -1], [900, 476, 0, -1], [1120, 476, 0, -1], [532, 140, 1, 0], [532, 640, 1, 0], [788, 160, -1, 0]].forEach(l => lamp(...l));
  signal(554, 302, true); signal(766, 506, true); signal(554, 506, false); signal(766, 302, false);
}

// ---------- vehicles ----------
function car(x, y, a, c, o = {}) {
  const L = o.L || 70, Wd = o.W || 31;
  ctx.save(); ctx.translate(x + SH.x * 9, y + SH.y * 9); ctx.rotate(a); ctx.filter = `blur(${SH.blur + 1.5}px)`; ctx.fillStyle = `rgba(5,5,12,${SH.a + .1})`; rr(-L / 2, -Wd / 2, L, Wd, 9); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = '#0d0d0f'; [[-L * .3, -1], [L * .3, -1], [-L * .3, 1], [L * .3, 1]].forEach(([tx, s]) => ctx.fillRect(tx - 7, s * Wd / 2 - 2, 14, 4));
  const gloss = (p) => { const g = ctx.createLinearGradient(0, -Wd / 2, 0, Wd / 2); g.addColorStop(0, 'rgba(255,255,255,.3)'); g.addColorStop(.35, 'rgba(255,255,255,.06)'); g.addColorStop(.65, 'rgba(0,0,0,.05)'); g.addColorStop(1, 'rgba(0,0,0,.38)'); ctx.fillStyle = g; p(); ctx.fill(); };
  if (o.type === 'box') {
    ctx.fillStyle = col(c); rr(L / 2 - 26, -Wd / 2 + 1, 26, Wd - 2, 6); ctx.fill(); gloss(() => rr(L / 2 - 26, -Wd / 2 + 1, 26, Wd - 2, 6));
    ctx.fillStyle = col('#1b232c'); ctx.fillRect(L / 2 - 12, -Wd / 2 + 4, 6, Wd - 8);
    ctx.fillStyle = col('#ecebe6'); rr(-L / 2, -Wd / 2 - 1, L - 28, Wd + 2, 2); ctx.fill(); gloss(() => rr(-L / 2, -Wd / 2 - 1, L - 28, Wd + 2, 2));
    ctx.strokeStyle = col('#b9b7b0'); ctx.lineWidth = .8; for (let i = -L / 2 + 6; i < L / 2 - 30; i += 7) line(i, -Wd / 2, i, Wd / 2);
  } else if (o.type === 'bus') {
    ctx.fillStyle = col('#e9ebee'); rr(-L / 2, -Wd / 2, L, Wd, 6); ctx.fill(); gloss(() => rr(-L / 2, -Wd / 2, L, Wd, 6));
    ctx.fillStyle = col('#1d5fae'); ctx.fillRect(-L / 2 + 4, -Wd / 2, L - 8, 3); ctx.fillRect(-L / 2 + 4, Wd / 2 - 3, L - 8, 3);
    ctx.fillStyle = col('#c9ccd0'); [[-50, 26], [-10, 20], [24, 18]].forEach(([u, w]) => { rr(u, -9, w, 18, 3); ctx.fill(); ctx.strokeStyle = col('#9a9ea4'); ctx.lineWidth = .8; ctx.stroke(); });
    ctx.fillStyle = col('#1b232c'); ctx.fillRect(L / 2 - 6, -Wd / 2 + 3, 4, Wd - 6);
  } else {
    ctx.fillStyle = col(c); rr(-L / 2, -Wd / 2, L, Wd, 9); ctx.fill(); gloss(() => rr(-L / 2, -Wd / 2, L, Wd, 9));
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = .8; line(L * .3, -Wd * .25, L * .45, -Wd * .28); line(L * .3, Wd * .25, L * .45, Wd * .28);
    const g = ctx.createLinearGradient(L * .08, -Wd / 2, L * .26, Wd / 2); g.addColorStop(0, col('#0f141a')); g.addColorStop(.45, col(GOLD ? '#6a4a52' : '#3a4a5a')); g.addColorStop(.55, col('#0f141a')); g.addColorStop(1, col('#1b232c'));
